name: Finite-QAM smoke check
on: [push, pull_request, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python scripts/smoke_check.py
      - run: python scripts/smoke_recent.py
      - run: python scripts/show_results.py
      - run: python scripts/run.py --run-dir runs/ci generate --small
      - run: python scripts/run.py --run-dir runs/ci train bn --smoke
